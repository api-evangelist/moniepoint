naftiko: 1.0.0-alpha2
info:
  label: Monnify Direct Debit — Debits
  description: Debit an active direct-debit mandate, including optional incomeSplit (April 2026) to settle into sub-accounts.
    Self-contained Naftiko capability covering one Monnify business surface.
  tags:
  - Moniepoint
  - Monnify
  - Direct Debit
  - Debits
  created: '2026-05-24'
  modified: '2026-05-24'
binds:
- namespace: env
  keys:
    MONNIFY_ACCESS_TOKEN: MONNIFY_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: direct-debit-debit
    baseUri: https://api.monnify.com
    description: Monnify Direct Debit — Debits business capability.
    resources:
    - name: mandate-debit
      path: /api/v1/direct-debit/mandate/debit
      operations:
      - name: debitMandate
        method: POST
        description: Monnify Debit Direct Debit Mandate
        outputRawFormat: json
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.MONNIFY_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: mcp
    namespace: direct-debit-debit-mcp
    port: 9090
    transport: http
    description: MCP adapter for Monnify Direct Debit — Debits.
    tools:
    - name: monnify-debit-mandate
      description: Monnify Debit Direct Debit Mandate
      hints: { readOnly: false, destructive: true, idempotent: false }
      call: direct-debit-debit.debitMandate
      with:
        body: tools.body
