naftiko: 1.0.0-alpha2
info:
  label: Monnify Disbursements — Bulk Transfers
  description: Initiate bulk NIP transfers and look up batch summary and per-item status.
    Self-contained Naftiko capability covering one Monnify business surface.
  tags:
  - Moniepoint
  - Monnify
  - Disbursements
  - Bulk
  created: '2026-05-24'
  modified: '2026-05-24'
binds:
- namespace: env
  keys:
    MONNIFY_ACCESS_TOKEN: MONNIFY_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: disbursements-bulk
    baseUri: https://api.monnify.com
    description: Monnify Disbursements — Bulk Transfers business capability.
    resources:
    - name: bulk
      path: /api/v2/disbursements/bulk
      operations:
      - name: initiateBulkTransfer
        method: POST
        description: Monnify Initiate Bulk Transfer
        outputRawFormat: json
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: bulk-summary
      path: /api/v2/disbursements/bulk/summary
      operations:
      - name: getBulkTransferSummary
        method: GET
        description: Monnify Get Bulk Transfer Summary
        outputRawFormat: json
        inputParameters:
        - name: batchReference
          in: query
          type: string
          required: true
    - name: bulk-items
      path: /api/v2/disbursements/bulk/{batchReference}/transactions
      operations:
      - name: listBulkTransferItems
        method: GET
        description: Monnify List Bulk Transfer Items
        outputRawFormat: json
        inputParameters:
        - name: batchReference
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.MONNIFY_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: mcp
    namespace: disbursements-bulk-mcp
    port: 9090
    transport: http
    description: MCP adapter for Monnify Disbursements — Bulk Transfers.
    tools:
    - name: monnify-initiate-bulk-transfer
      description: Monnify Initiate Bulk Transfer
      hints: { readOnly: false, destructive: true, idempotent: false }
      call: disbursements-bulk.initiateBulkTransfer
      with:
        body: tools.body
    - name: monnify-bulk-transfer-summary
      description: Monnify Get Bulk Transfer Summary
      hints: { readOnly: true, destructive: false, idempotent: true }
      call: disbursements-bulk.getBulkTransferSummary
    - name: monnify-list-bulk-transfer-items
      description: Monnify List Bulk Transfer Items
      hints: { readOnly: true, destructive: false, idempotent: true }
      call: disbursements-bulk.listBulkTransferItems
