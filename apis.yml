apis:
- aid: moniepoint:monnify-webhooks
  name: Monnify Webhooks
  tags:
  - Webhook
  - Event
  - HMAC
  - SHA-512
  tags_raw:
  - Webhooks
  - Events
  - HMAC
  - SHA-512
  humanURL: https://developers.monnify.com/docs/webhooks
  properties:
  - url: https://developers.monnify.com/docs/webhooks
    type: Documentation
  - url: json-schema/monnify-webhook-schema.json
    type: JSONSchema
  description: >-
    Asynchronous server-to-server notifications for nine event categories — successful collection, successful
    / failed / reversed disbursement, successful / failed refund, settlement completion, mandate status
    change, wallet activity, and low_balance_alert (added September 2025). Every payload includes a monnify-signature
    header computed as HMAC-SHA-512 of the stringified request body using the client secret. Standard
    envelope { eventType, eventData }.
